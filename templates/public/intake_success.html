<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Success — AIESEC oGT Connect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0a0f1e; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .success-card { background: #111827; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 3rem 2rem; max-width: 500px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .icon { font-size: 4rem; margin-bottom: 1rem; display: block; }
    h2 { font-weight: 800; color: #fff; margin-bottom: 1rem; }
    p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 2rem; }
    .btn-primary { background: linear-gradient(90deg, #6366f1, #4f46e5); border: none; padding: .7rem 1.5rem; font-weight: 600; border-radius: 8px; text-decoration: none; color: #fff; }
    .btn-primary:hover { opacity: 0.9; color: #fff; }
  </style>
</head>
<body>
  <div class="success-card">
    <span class="icon">✨</span>
    <h2>Submission Received</h2>
    <p>Thank you for connecting with AIESEC oGT. We have received your details and will be in touch shortly.</p>
    <a href="{% url 'public_intake' %}" class="btn-primary">Return to form</a>
  </div>
</body>
</html>
